services:
  daybook:
    build: .
    image: daybook:latest
    container_name: daybook
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8484}:3000"
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_PATH=/data/daybook.db
      - DAYBOOK_SETUP_USERNAME=${DAYBOOK_SETUP_USERNAME:-admin}
      - DAYBOOK_SETUP_PASSWORD=${DAYBOOK_SETUP_PASSWORD:-daybook-setup}
      - DAYBOOK_USER_NAME=${DAYBOOK_USER_NAME:-Sara}
    volumes:
      - ${DATA_PATH:-./data}:/data
