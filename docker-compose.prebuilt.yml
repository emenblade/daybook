# Runs the prebuilt image (docker load -i daybook-1.2.1-amd64.tar first).
services:
  daybook:
    image: daybook:latest
    container_name: daybook
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8484}:3000"
    environment:
      - TZ=${TZ:-UTC}
      - DATABASE_PATH=/data/daybook.db
    volumes:
      - ${DATA_PATH:-./data}:/data
